<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Chatbot UI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            text-align: center;
        }
        #chat-area {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .message {
            margin: 10px 0;
        }
        .user {
            text-align: right;
        }
        .bot {
            text-align: left;
        }
        #input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ccc;
        }
        #user-input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        #send-button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
        }
        #suggestions {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
        }
        .suggestion {
            background-color: #e7e7e7;
            border-radius: 5px;
            padding: 10px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>Chatbot</header>
    <div id="chat-area">
        <div class="message user">User: Hello!</div>
        <div class="message bot">Bot: Hi there! How can I help you today?</div>
    </div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Type your message...">
        <button id="send-button">Send</button>
    </div>
    <div id="suggestions">
        <div class="suggestion">How to use this chatbot?</div>
        <div class="suggestion">Show me examples.</div>
        <div class="suggestion">Help me with an issue.</div>
    </div>
    <script>
        const sendButton = document.getElementById('send-button');
        const userInput = document.getElementById('user-input');
        const chatArea = document.getElementById('chat-area');

        sendButton.addEventListener('click', () => {
            const userMessage = userInput.value;
            if (userMessage) {
                const userMessageElement = document.createElement('div');
                userMessageElement.className = 'message user';
                userMessageElement.innerText = `User: ${userMessage}`;
                chatArea.appendChild(userMessageElement);
                userInput.value = '';
                // Simulate bot response
                setTimeout(() => {
                    const botMessageElement = document.createElement('div');
                    botMessageElement.className = 'message bot';
                    botMessageElement.innerText = `Bot: Thank you for your message!`;
                    chatArea.appendChild(botMessageElement);
                }, 1000);
            }
        });
    </script>
</body>
</html>
